# BrainRVQ-inspired configuration expressed through the EEG-DAC trainer.
# This is NOT BrainRVQ itself. It maps the paper's quantization scale into DAC:
#   paper: 200 Hz, fixed 19 channels, 1-s patches, temporal + frequency branches,
#          three RVQ stages/branch, K=8192, D=64, commitment beta=1,
#          EMA=0.99 and K-means initialization.
#   here:  256 Hz Alice data, independent mono electrodes, 1-s DAC frames,
#          one stream x six RVQ stages, K=8192, D=64, gradient-updated codebooks.
# DAC cannot reproduce its dual Transformer branches, cross-electrode processing,
# EMA/K-means codebooks, or normalized complex-FFT reconstruction exactly.

DAC.sample_rate: 256
DAC.encoder_dim: 64
DAC.encoder_rates: [4, 4, 4, 4]   # hop 256 = one latent frame per second
DAC.decoder_dim: 512
DAC.decoder_rates: [4, 4, 4, 4]

# Collapse two paper branches into one DAC RVQ stack: 2 x 3 = 6 indices/frame.
DAC.n_codebooks: 6
DAC.codebook_size: 8192
DAC.codebook_dim: 64
DAC.quantizer_dropout: 0.0

# The released tokenizer code defaults to lr=5e-5 and weight decay=1e-4.
# The paper text reports lr=5e-4; this file follows the released implementation.
# Its cosine schedule/warm-up are unavailable here, so the LR remains constant.
AdamW.betas: [0.9, 0.999]
AdamW.lr: 5.0e-05
AdamW.weight_decay: 1.0e-04
ExponentialLR.gamma: 1.0
amp: false
# BrainRVQ used batch 128. Batch 12 is the safe local DAC comparison setting.
batch_size: 12
val_batch_size: 12
num_iters: 13660       # 20 epochs, matching the released tokenizer default
valid_freq: 683
num_workers: 0
seed: 0
# BrainRVQ leaves clipping unset; retain the empirically stable DAC safeguard.
grad_clip: 100.0
resume: false
save_path: runs/eeg_brainrvq_dac_approx

WandB.enabled: true
WandB.project: eeg-dac
WandB.entity: ""
WandB.name: eeg-brainrvq-dac-approx
WandB.group: model-comparison
WandB.tags: [eeg, dac, brainrvq-approx, 1s, 6x8192]
WandB.mode: online
WandB.log_freq: 1
WandB.log_reconstruction: true
WandB.watch_model: false

EEGPlots.enabled: true
EEGPlots.every_epochs: 10
EEGPlots.n_examples: 16
EEGPlots.augmentation_examples: 5
EEGPlots.seconds: 5.0
EEGPlots.seed: 7
EEGPlots.psd_fmin: 1.0
EEGPlots.psd_fmax: 45.0
EEGPlots.psd_window_seconds: 1.0

# Closest available objective: time-domain reconstruction plus log-power STFT.
# BrainRVQ instead uses time MSE plus normalized FFT amplitude/phase MSE.
# DAC needs gradient codebook loss; diversity substitutes for EMA/K-means.
lambdas:
  waveform/loss: 10.0
  stft/loss: 1.0
  vq/commitment_loss: 1.0
  vq/codebook_loss: 1.0
  eeg/diversity_loss: 0.1
  eeg/latent_consistency_loss: 0.0

EEGAugment.enabled: false

# Common evaluation corruption distribution; not a BrainRVQ training objective.
EEGEvalAugment.enabled: true
EEGEvalAugment.amplitude_scale_probability: 0.5
EEGEvalAugment.amplitude_scale: [0.5, 1.5]
EEGEvalAugment.slow_drift_probability: 0.5
EEGEvalAugment.slow_drift_frequency_hz: [0.05, 0.5]
EEGEvalAugment.slow_drift_amplitude: [0.0, 0.15]
EEGEvalAugment.baseline_shift_probability: 0.5
EEGEvalAugment.baseline_shift_offset: [-0.15, 0.15]
EEGEvalAugment.phase_shift_probability: 0.5
EEGEvalAugment.phase_shift_max_radians: 0.785398
EEGEvalAugment.line_noise_probability: 0.5
EEGEvalAugment.line_noise_frequencies_hz: [50.0, 60.0]
EEGEvalAugment.line_noise_amplitude: [0.0, 0.08]
EEGEvalAugment.gaussian_noise_probability: 0.5
EEGEvalAugment.gaussian_noise_std: [0.0, 0.1]
EEGEvalAugment.signal_mix_probability: 0.5
EEGEvalAugment.signal_mix_fraction: [0.0, 0.1]
EEGEvalAugment.clip: 1.0

EEGLoss.stft_windows: [64, 128, 256]
EEGLoss.stft_mode: log_power

train/build_dataset.files:
  - /data/groups/bci/datasets/alice/Alice/cache/prep/*_cleaned_noref_raw.fif
train/build_dataset.window_seconds: 10.0
train/build_dataset.n_examples: 8192
train/build_dataset.split: train
train/build_dataset.train_fraction: 0.8
train/build_dataset.clip_mad: 8.0
train/build_dataset.normalization_seconds: 30.0
train/build_dataset.normalization_chunks: 3
train/build_dataset.seed: 0

val/build_dataset.files:
  - /data/groups/bci/datasets/alice/Alice/cache/prep/*_cleaned_noref_raw.fif
val/build_dataset.window_seconds: 10.0
val/build_dataset.n_examples: 1024
val/build_dataset.split: val
val/build_dataset.train_fraction: 0.8
val/build_dataset.clip_mad: 8.0
val/build_dataset.normalization_seconds: 30.0
val/build_dataset.normalization_chunks: 3
val/build_dataset.seed: 0
