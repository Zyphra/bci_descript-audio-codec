# EEG REPLACEMENT — same recordings, different temporal split per scope:
train/build_dataset.files:
  - /data/groups/bci/datasets/alice/Alice/cache/prep/*_cleaned_noref_raw.fif
train/build_dataset.window_seconds: 10.0
train/build_dataset.n_examples: 8192
train/build_dataset.split: train
train/build_dataset.train_fraction: 0.8
train/build_dataset.clip_mad: 8.0
train/build_dataset.normalization_seconds: 30.0
train/build_dataset.normalization_chunks: 3
train/build_dataset.seed: 0

val/build_dataset.files:
  - /data/groups/bci/datasets/alice/Alice/cache/prep/*_cleaned_noref_raw.fif
val/build_dataset.window_seconds: 10.0
val/build_dataset.n_examples: 1024
val/build_dataset.split: val
val/build_dataset.train_fraction: 0.8
val/build_dataset.clip_mad: 8.0
val/build_dataset.normalization_seconds: 30.0
val/build_dataset.normalization_chunks: 3
val/build_dataset.seed: 0
